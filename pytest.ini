[pytest]
# Los tests async se detectan solos: sin esto cada uno necesitaria su marca.
asyncio_mode = auto
testpaths = tests
# El corpus real y los servicios quedan fuera de la suite: `pytest` corre sin Redis, sin
# Docker y sin claves. Lo que necesita el sistema vivo lo prueban demo.py y los verificadores.
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:langchain_community.*
